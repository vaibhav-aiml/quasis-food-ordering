name: Build Android APK

on:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Standalone Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'

      - name: 📝 Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 📦 Install Root & Mobile Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: ⚙️ Generate Native Android Project (Bare Expo Prebuild)
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: 🔧 Patch Build Config Compatibility
        run: |
          if [ -f "apps/mobile/android/app/build.gradle" ]; then
            sed -i '/enableBundleCompression/d' apps/mobile/android/app/build.gradle
          fi

      - name: 🔨 Grant Gradle Permissions
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew

      - name: 🏗️ Build Debug APK
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 🚀 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quasis-swiggy-agent-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
